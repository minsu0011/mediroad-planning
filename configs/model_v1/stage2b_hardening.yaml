  policy_sigungu_aggregation: equal_sigungu_weight
  primary_season_definition: meteorological
  season_order: [spring, summer, autumn, winter]
  season_definitions:
    meteorological:
      spring: [3, 4, 5]
      summer: [6, 7, 8]
      autumn: [9, 10, 11]
      winter: [12, 1, 2]
    calendar_quarters:
      spring: [1, 2, 3]
      summer: [4, 5, 6]
      autumn: [7, 8, 9]
      winter: [10, 11, 12]
    shifted_plus_one_month:
      spring: [4, 5, 6]
      summer: [7, 8, 9]
      autumn: [10, 11, 12]
      winter: [1, 2, 3]
  consensus_methods: [mean_rank, median_rank, borda_rank, worst_year_rank]
  release_consensus_method: median_rank_then_pooled_score_then_fixed_season_order
  positive_strength_scenarios: [0.25, 0.50, 0.75, 1.00]
  bounded_temporal_lambdas: [0.10, 0.20, 0.30]
  permutation_method: independently_shuffle_month_labels_within_sigungu_year_service
  block_bootstrap_method: resample_11_policy_sigungu_with_complete_month_and_service_sequences
  no_pooling_in_cross_year_fit: true

