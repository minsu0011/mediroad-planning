    granularity: "admin_dong"
    proxy: false
    semantic_group: "beneficiary_scale"
    ablation_cluster: "demographic_vulnerability"
    transform: "log1p"
    unit: "persons"
    value_type: "count"
    missing_semantics: "complete_required"
    confidence: "high"
    description: "공식 주민등록 기반 잠재 수혜 고령인구 규모이며 실제 환자수나 방문자수 라벨이 아니다. 75세 이상 인구와 같은 의미그룹에서 평균해 단일 연령절단점 의존을 줄인다."

