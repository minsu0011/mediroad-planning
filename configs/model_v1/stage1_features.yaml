scalers:
  robust_zscore:
    label_ko: "강건 Z 점수"
    method: "median_mad_zscore"
    parameters:
      center: "median"
      scale: "1.4826_times_mad"
      clip_lower: -3.0
      clip_upper: 3.0
      output_range: [0.0, 100.0]
    description: "중앙값과 MAD를 사용하고 극단 Z값을 절단한다."
  winsorized_percentile:
    label_ko: "윈저화 백분위"
    method: "winsorize_then_empirical_percentile"
    parameters:
      lower_quantile: 0.01
      upper_quantile: 0.99
      tie_method: "average"
      output_range: [0.0, 100.0]
    description: "1·99백분위에서 절단한 뒤 경험 백분위로 변환하는 기본 scaler다."
  rank_percentile:
    label_ko: "순위 백분위"
    method: "average_rank_percentile"
    parameters:
      tie_method: "average"
      output_range: [0.0, 100.0]
    description: "분포 형태와 극단값에 가장 강건한 순위 민감도 scaler다."
  robust_minmax:
    label_ko: "강건 Min-Max"
    method: "quantile_clipped_minmax"
    parameters:
      lower_quantile: 0.05
      upper_quantile: 0.95
      clip: true
      output_range: [0.0, 100.0]
    description: "5·95백분위를 기준으로 범위를 제한한 설명 가능한 Min-Max scaler다."
