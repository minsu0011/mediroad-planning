schema_version: "1.0"
model_version: "MEDIROAD_MODEL_V1_STAGE1"
stage: "need_score_feature_selection"
description: >-
  Leakage-safe, interpretable Stage-1 feature registry for the five-axis MEDIROAD
  Need Score. Population counts represent potential beneficiary scale, never
  predicted patient demand. OSM travel times are static car-profile free-flow
  estimates, not observed or real-time travel times.

source:
  master: "derived/mediroad_admin_dong_master_v6_road_integrated.csv"
  audit: "reports/V6_FEATURE_COLUMN_AUDIT.csv"
  expected_admin_dong_rows: 153
  expected_master_columns: 549
  audited_frozen_columns: 525
  appended_osm_columns: 24

feature_selection:
  expected_active_feature_count: 30
  default_weight_profile: "balanced_policy"
  default_scaler: "winsorized_percentile"
  high_correlation_review_threshold_abs_spearman: 0.90
  missing_policy: "preserve_semantic_missingness; never unconditional-median-impute"
  scoring_direction_rule: "after direction normalization, larger means higher need"
  specialty_policy: "specialty-specific supply and access are deferred to Specialty Gap V1"
  outreach_policy: "historical outreach is validation/optimizer context and never a Need Score input"

axes:
  A_demographic_vulnerability:
    code: "A"
    label_ko: "인구학적 취약성"
    label_en: "Demographic Vulnerability"
    description: "잠재 수혜 규모, 고령 강도, 고령 독거 취약성"
  B_health_burden:
    code: "B"
    label_ko: "건강부담"
    label_en: "Health Burden"
    description: "11개 시군 CHS 고령자 건강부담 맥락; 153개 독립표본으로 취급하지 않음"
  C_medical_supply_access_gap:
    code: "C"
    label_ko: "의료공급·접근공백"
    label_en: "Medical Supply and Access Gap"
    description: "읍면동 내 일반 의료공급과 OSM 도로망 기반 정적 접근시간"
  D_transport_access_gap:
    code: "D"
    label_ko: "대중교통 접근공백"
    label_en: "Transport Access Gap"
    description: "최근접 정류장과 2024-03 평일 GTFS 공급 baseline"
  E_isolation_equity:
    code: "E"
    label_ko: "고립·형평성"
    label_en: "Isolation and Equity"
    description: "읍면 여부, 인구감소지역, 저밀도 정주구조"

