  final_efficiency_must_not_underperform_constrained_greedy: true
  high_level_release_may_be_ready_for_field_validation_when_uncertified: true
  highs_primary_requires_same_contract_recomputation: true
  compressed_cp_sat_is_diagnostic_only: true

