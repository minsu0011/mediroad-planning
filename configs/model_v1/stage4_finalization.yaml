version: MEDIROAD_STAGE4_FINALIZATION_V1
contract_status: post_quality_gate_and_greedy_floor_hardening_frozen_before_rerun
contract_change_reason: >-
  A read-only 120-second diagnostic established a certified frozen Top3 baseline
  while Top5 and coarse-Pareto expansion proofs remained inconclusive. This
  fail-closed disposition rule changes no performance threshold and forbids claims
  from uncertified incumbents. The first official Stage 4.1 attempt
  stage4_1_20260819T184615Z_b221621d4413 then failed closed because the diagnostic
  frontier efficiency solve at n=25 produced no incumbent within the predeclared
  30-second stage budget. Before rerun, a single sequential 120-second no-incumbent
  retry was frozen; it preserves the objective plan, senses, retention formula,
  constraint family, comparison threshold, candidate universe, and promotion rule.
  A pre-rerun runtime smoke also showed that SciPy/HiGHS cannot change its
  process-global scheduler from four to eight threads after initialization, so
  the retry keeps four threads and gains resources by running without a competing
  frontier task. The second official attempt
  stage4_1_20260819T194409Z_3bc5514c72c4 completed the n=25 retry but failed
  before release because one quality-gate consumer used `scenario` instead of
  the canonical `travel_scenario`. That schema link is now fail-closed and
  regression-tested. The same failed run also exposed that the final
  lexicographic Efficiency policy could fall below the same-base-constraint
  deterministic greedy solution even though its first objective stage was
  better. The pre-existing zero-tolerance no-harm gate is therefore enforced as
  an absolute greedy population floor from the first Efficiency stage through
  the final cost stage. No tolerance, objective, retention fraction, candidate
  universe, or promotion threshold was relaxed.
stage5_started: false

