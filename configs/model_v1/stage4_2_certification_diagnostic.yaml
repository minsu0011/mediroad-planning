version: MEDIROAD_STAGE4_2C_CERTIFICATION_DIAGNOSTIC_V3_GUIDED_ORACLE
stage5_started: false

paths:
  output_root: outputs/model_v1/10_stage4_2_certification_diagnostic
  report_root: reports/model_v1/stage4_2_certification_diagnostic
  lock: outputs/model_v1/.stage4_2_certification_diagnostic_writer.lock

hardware:
  profile: intel_core_ultra_7_258v_32gb_optional_cuda_gpu
  highs_threads: 8
  memory_limit_gb: 28
  gpu_seed_search: true
  allow_native_windows_parallel: true
  native_windows_highs_threads: 4

formulation:
  one_link_pattern_formulation: true
  min_sigungu_mode: continuous_auxiliary_with_threshold_oracle
  min_sigungu_integer_scale: 1000000
  integer_count_deviation_convex_hull: true
  stage_specific_variables: true
  preserve_candidate_universe: true
  preserve_lexicographic_retention: true

solver:
  backend: direct_highspy
  minimum_highs_version: 1.8.0
  random_seed: 42
  mip_heuristic_effort: 0.15
  oracle_heuristic_effort: 0.02
  oracle_heuristic_effort_by_objective:
    min_sigungu_coverage: 0.05
    high_need_population: 0.50
    need_weighted: 0.20
    total_population: 0.20
    cost: 0.10
  mip_max_start_nodes: 2000
  default_time_limit_sec: 60
  log_to_console: false
  write_mps: false
  time_limit_sec:
    common:
      total_population: 30
      need_weighted: 30
      high_need_population: 60
      min_sigungu_coverage: 60
      cost: 60
    efficiency:
      total_population: 30
      need_weighted: 30
      min_sigungu_coverage: 60
      cost: 60
    balanced:
      need_weighted: 30
      min_sigungu_coverage: 60
      total_population: 30
      cost: 60
    equity:
      min_sigungu_coverage: 60
      high_need_population: 60
      need_weighted: 60
      cost: 60
  extra_highs_options: {}

gate:
  near_optimal_relative_gap_max: 0.005
  gap_threshold_must_not_be_relaxed: true
  stop_scenario_on_uncertified_stage: false
  run_equity_even_if_eb_uncertified: true
  require_equity_certification: false
  require_candidate_expansion_certification: false

oracle:
  enabled: true
  guided_objective_enabled: true
  stop_at_objective_target: true
  max_rounds: 1
  default_time_limit_sec: 60
  time_limit_sec:
    total_population: 30
    need_weighted: 30
    high_need_population: 60
    min_sigungu_coverage: 60
    cost: 60

seed_search:
  single_swap_enabled: true
  cpu_max_rounds: 4
  max_rounds: 3

candidate_expansion:
  enabled: false
  candidate_sets: [top3]
  reference_candidate_set: top3
  max_unique_coverage_loss_fraction: 0.01
  max_need_weighted_loss_fraction: 0.01
  max_high_need_loss_fraction: 0.02
  max_min_sigungu_coverage_loss: 0.02
  min_coverage_cluster_jaccard: 0.50
