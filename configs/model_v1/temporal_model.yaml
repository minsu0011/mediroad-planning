version: MEDIROAD_MODEL_V1_STAGE2B_20260818
target_definition: relative_monthly_service_and_operational_fit_not_demand_prediction
planning_resolution: season
exact_date_status: unavailable_requires_operator_calendar
random_seed: 42

source:
  road_master: derived/mediroad_admin_dong_master_v6_road_integrated.csv
  stage2_specialty_scores: outputs/model_v1/04_specialty/specialty_gap_scores.parquet
  nhis_monthly_raw: 14_v6_external_data/stage2_temporal/raw/nhis_sigungu_specialty_month_2022_2023.csv
  nhis_encoding: cp949
  public_holiday_api: https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService/getRestDeInfo
  weather_api: https://power.larc.nasa.gov/api/temporal/daily/point
  weather_fallback_api: https://archive-api.open-meteo.com/v1/archive
  weather_model: NASA_POWER_MERRA2
  weather_start_date: 1991-01-01
  weather_end_date: 2025-12-31
  expected_admin_dongs: 153
  expected_policy_sigungu: 11
  frozen_canonical_sha256: 3bcff13063c741edf1492df22b774bd6d37424d729c15423e31ba8ea576adf7a

nhis_seasonality:
  observed_years: [2022, 2023]
  primary_measure: visits_per_working_day
  secondary_measure: persons_per_working_day
  policy_sigungu_aggregation: equal_sigungu_mean
  cheongju_mapping: merge_four_gu_and_legacy_cheongwon_to_policy_cheongju
  outpatient_primary_exposure: weekdays_minus_official_holidays
  emergency_primary_exposure: calendar_days
  exposure_sensitivity: monday_to_saturday_minus_official_holidays
  lower_modifier: 0.85
  upper_modifier: 1.15
  reliability_shrinkage:
    method: preregistered_reliability_tier_to_neutral
    high_lambda: 0.50
    moderate_lambda: 0.25
    low_lambda: 0.0
    high_min_both_measure_spearman: 0.70
    high_max_total_variation: 0.05
    high_max_peak_distance_months: 1
    high_min_patient_visit_profile_spearman: 0.70
    moderate_min_median_measure_spearman: 0.40
    moderate_max_total_variation: 0.075
  interpretation: observed_insured_utilization_seasonality_not_unmet_need_or_patient_demand

bundle_season_reliability:
  method: bundle_weighted_raw_year_profiles_then_reliability_shrink
  comparison_tolerance: 0.000000000001
  flat_signal_tolerance: 0.000000000001
  high_lambda: 0.50
  moderate_lambda: 0.25
  low_lambda: 0.0
  high_min_season_rank_spearman: 0.70
  high_require_top1_agreement: true
  moderate_min_season_rank_spearman: 0.40
  interpretation: release_unit_validation_aligned_with_release_unit_scoring

weather:
  variables:
    - temperature_2m_max
    - temperature_2m_min
    - precipitation_sum
    - wind_speed_10m_max
  wind_speed_unit: ms
  timezone: Asia/Seoul
  batch_size: 20
  thresholds:
    heat_day_max_c: 33.0
    cold_day_min_c: -12.0
    heavy_rain_day_mm: 30.0
    strong_wind_day_ms: 14.0
  hazard_weights:
    heat_days: 0.25
    cold_days: 0.25
    heavy_rain_days: 0.30
    strong_wind_days: 0.20
  unavailable_hazard:
    snowfall: unknown_not_zero_nasa_power_daily_has_no_direct_snowfall_field
  interpretation: nasa_power_merra2_reanalysis_operational_climate_proxy_not_date_specific_forecast

temporal_fit:
  component_weights:
    seasonal_service_fit: 1.00
  primary_score_contract:
    evidence_scope: province_common_bundle_season
    climate_role: historical_operational_risk_advisory_not_primary_selector
    transit_role: static_spatial_context_not_temporal_rank_selector
    reason: climate_season_loyo_failed_and_static_transit_has_no_month_variation
  advisory_components:
    climate_operational_fit: retained_for_historical_risk_annotation_and_sensitivity_not_date_specific_trigger
    transit_time_fit: retained_as_static_context_for_later_spatial_optimization
  unavailable_components:
    calendar_feasibility: unknown_not_zero_excluded_from_weight_denominator
    future_service_overlap: unknown_not_zero_excluded_from_weight_denominator
    team_vehicle_equipment_availability: unknown_not_zero_excluded_from_weight_denominator
  seasonality_strength_scenarios: [0.0, 0.5, 1.0]
  weather_weight_scenarios: [0.05, 0.10, 0.25, 0.45]
  fallback_rule: highest_scoring_month_outside_primary_month_and_prefer_different_quarter
  exact_date_output: null
  future_replan_design_horizon_days: 14
  replan_trigger_status: unavailable_requires_date_specific_forecast_and_operator_service_date

quality_gates:
  expected_temporal_audit_min_rows: 10
  expected_nhis_years: 2
  expected_nhis_months_per_year: 12
  expected_weather_years: 35
  expected_weather_admin_dongs: 153
  expected_weather_daily_rows: 1955952
  expected_monthly_climate_rows: 1836
  expected_region_bundle_month_rows: 9180
  expected_recommendation_rows: 765
  expected_actionable_recommendation_rows: 765
  expected_no_signal_recommendation_rows: 0
  expected_unavailable_rows_with_fabricated_season_count: 0
  expected_available_date_specific_replan_trigger_rows: 0
  minimum_bundle_season_fit_range_for_release: 0.000000001
  weather_daily_completeness_min: 0.995
  temporal_output_missing_count_max: 0
  unknown_operational_fields_encoded_as_zero_max: 0
  fallback_distinct_from_primary_fraction_min: 1.0
  bundle_year_holdout_median_spearman_min: 0.50
  bundle_year_holdout_median_top3_jaccard_min: 0.40
  monthly_resolution_loyo_spearman_min: 0.40
  monthly_resolution_top3_jaccard_min: 0.50
  monthly_resolution_exposure_sensitivity_spearman_min: 0.75
  monthly_resolution_exposure_sensitivity_top3_jaccard_min: 0.50
  monthly_resolution_peak_distance_months_max: 2
  climate_loyo_month_rank_spearman_min: 0.70
  climate_loyo_top3_recall_min: 0.67
  climate_hazard_monotonicity_min: 1.0
  seasonal_resolution_climate_loyo_spearman_min: 0.60
  seasonal_resolution_climate_top2_recall_min: 0.75
  seasonal_resolution_climate_top1_agreement_min: 0.50
  seasonal_resolution_nhis_loyo_spearman_min: 0.40
  seasonal_resolution_nhis_top1_agreement_min: 0.50
  bundle_validation_release_unit_match_min: 1.0
  bundle_validation_release_direction_concordance_min: 1.0
  bundle_release_profile_mismatch_max: 0
  bundle_released_primary_in_both_year_top2_min: 1.0
  bundle_selector_validation_match_fraction_min: 1.0
  low_evidence_release_count_max: 0
  validation_release_profile_mismatch_count_max: 0
  released_primary_in_both_year_top2_fraction_min: 1.0
  temporal_source_ablation_coverage: 1.0
  temporal_component_ablation_coverage: 1.0
  default_ablation_median_spearman_min: 0.90
  default_ablation_top3_recall_min: 0.67
  representative_exact_duplicate_pairs_max: 0
  representative_unexplained_abs_rho_098_pairs_max: 0
  no_exact_date_claims: true
  no_admin_specific_clinical_seasonality_claims: true
  canonical_sha_unchanged: true
