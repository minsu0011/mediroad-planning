version: MEDIROAD_MODEL_V1_STAGE2A_20260818
target_definition: regional_specialty_service_gap_not_patient_demand
primary_formula: weighted_additive
primary_scaler: winsorized_percentile
random_seed: 42

source:
  road_master: derived/mediroad_admin_dong_master_v6_road_integrated.csv
  stage1_score: outputs/model_v1/03_ablation/stage1_primary_need_score.csv
  hira_specialty_pivot: 01_public_sources/v2_full/derived/chungbuk_hira_specialty_pivot_by_facility_202606.csv
  hira_facility_admin_join: 03_spatial_join/chungbuk_hira_facilities_by_admin_dong_202606.csv
  healthmap_holdout: 14_v5_additions/healthmap/clean_validation/healthmap_policy_sigungu_core_external_validation_2023_v5_2.csv
  legacy_gap_baseline: derived/mediroad_specialty_gap_v0.csv
  expected_admin_dongs: 153
  expected_policy_sigungu: 11
  frozen_canonical_sha256: 3bcff13063c741edf1492df22b774bd6d37424d729c15423e31ba8ea576adf7a
  road_master_sha256: faed8c4d024dfff89602eebf3229c1eaeea955ca2d14fb88f0e2cbc4f76e078a
  stage1_config_sha256: 3fe95a55e47b80ff1b0cb8c4819f21ed0dc855dcd696486e10e29025294def8a

model_contract:
  use_stage1_need_as_specialty_input: false
  use_legacy_v0_as_input: false
  general_access_handled_by_stage1: true
  specialty_access_definition: log1p_specialty_time_minus_log1p_general_medical_time
  supply_definition: empirical_bayes_specialty_share_within_local_medical_supply
  health_context_definition: service_context_minus_within_region_service_mean_fitted_on_11_sigungu
  age_structure_definition: service_age_fit_minus_within_region_service_mean
  public_support_definition: log1p_support_time_minus_log1p_general_medical_time
  health_context_effective_n: 11
  dental_role: adjunct_service_not_one_of_focused_15_physician_specialties
  emergency_role: referral_gap_only_not_mobile_emergency_treatment

component_weights:
  health_context_gap: 0.20
  age_structure_gap: 0.10
  specialty_supply_gap: 0.30
  specialty_excess_access_gap: 0.30
  public_support_gap: 0.10

supply:
  facility_share_prior_strength: 5.0
  specialist_share_prior_strength: 10.0
  prior_sensitivity_grid:
    facility_share_prior_strength: [2.0, 5.0, 10.0, 20.0]
    specialist_share_prior_strength: [5.0, 10.0, 20.0, 40.0]
  zero_total_supply_composition_gap: 0.5
  local_facility_share_weight: 0.45
  local_specialist_share_weight: 0.30
  sigungu_specialist_rate_weight: 0.25

scalers:
  winsorized_percentile:
    lower_quantile: 0.01
    upper_quantile: 0.99
  rank_percentile: {}
  robust_minmax:
    lower_quantile: 0.01
    upper_quantile: 0.99
  robust_z:
    clip_lower: -3.0
    clip_upper: 3.0

formula_families:
  weighted_additive:
    description: transparent compensatory weighted mean
  bounded_geometric:
    floor: 5.0
    description: low components cannot be fully compensated
  minimum_bottleneck_hybrid:
    additive_share: 0.70
    minimum_share: 0.30
    description: additive score mixed with the weakest supported component
  rank_composite:
    description: within-service component percentile ranks followed by weighted mean

